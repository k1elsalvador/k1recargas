<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <!-- Required by kiosk.js: the host maps CSS px to screen px with the display density. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>K1 Recargas</title>
  <link rel="stylesheet" href="kiosk.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">K1 <span>Recargas</span></div>
    <div class="demo-badge">DEMO</div>
    <div class="topbar-right">
      <span class="status-dot" id="status-dot" title="K1"></span>
      <button class="lang" id="lang-toggle" type="button">EN</button>
    </div>
  </header>
  <nav class="progress" id="progress" aria-hidden="true"></nav>
  <main id="app"></main>
  <footer class="demo-footer" id="demo-footer"></footer>

  <script src="kiosk.js"></script>
  <script src="recargas.js"></script>
</body>
</html>
